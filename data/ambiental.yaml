# Parámetros del TEWI (UNE-EN 378-1, anexo B; RD 552/2019, IF-02, apéndice 2) y del LCCP
# (IIR, Guideline for Life Cycle Climate Performance, 2016) — cap. 13, H7.
# Decisiones del autor del 05/10/2026 (docs/DECISIONES_2026_10_05.md, 3 a 6). Los null son
# datos que todavía no existen: el módulo `ambiental` falla si se invocan.
gwp_reglamento:     # Reglamento (UE) 2024/573: anexo I (AR4) para el R-32; anexo VI (AR6) para R-290 y R-717
  Ammonia: 0
  Propane: 0.02
  R32: 675
gwp_ar6:            # IPCC AR6 WG1, cap. 7 SM, tabla 7.SM.7 (GWP100); el NH3 no tiene GWP en el AR6
  Ammonia: 0
  Propane: 0.02
  R32: 771
fugas_anuales:      # fracción de la carga por año. Base: IIR 2016, tabla 3.2 (residencial compacta)
  base: 0.025
  minimo: 0.01      # UNEP RTOC 2022, §13.3.1 (objetivo factible 1–2 %/año)
  maximo: 0.05      # IIR 2016, tabla 3.2 (comercial); SWD(2022) 96, tabla 15 (3.5 %); RTOC (3.8 % medido)
recuperacion_fin_de_vida:   # fracción recuperada = 1 − pérdida al fin de vida
  base: 0.85        # IIR 2016, tabla 3.2 (EOL 15 %)
  minimo: 0.65      # SWD(2022) 96 final, anexo 4, tabla 15 (35 % al desecho, equipos pequeños)
  maximo: 0.85
vida_util_anos:
  base: 15          # IIR 2016, tabla 3.2 (residencial)
  minimo: 10        # IPCC 2006 GL, vol. 3, cap. 7, tabla 7.9
  maximo: 20
rd_552_2019:        # caso reglamentario español, aparte (IF-02, apéndice 2): L = 0,4·m^(2/3) kg/año
  coef_fugas_kg_ano: 0.4
  exponente_fugas: 0.6666666666666666
  recuperacion: 0.6 # "línea blanca"
factor_emision_red_kgCO2_kWh:
  minimo: 0.15      # cap. 6, §6.10.1, y tabla 1.2 (criterio de H7)
  maximo: 0.36
  rite_peninsular: 0.331   # documento reconocido RITE, Factores de emisión de CO2 (2014), p. 17
  ree_2024: 0.103          # REE REData, generación nacional 2024 (consultado 05/10/2026); punto de sensibilidad
lccp:
  fabricacion_refrigerante_kgCO2e_kg:   # RFM
    R32: 7.2               # IIR 2016, tabla 4.4
    Propane: 0.05          # IIR 2016, tabla 4.4
    Ammonia: 1.694         # IPCC 2006 GL, vol. 3, cap. 3, tabla 3.1 (síntesis; cota inferior)
  fabricacion_refrigerante_Ammonia_maximo: 2.5   # sensibilidad (ciclo de vida, sin verificar en fuente primaria)
  materiales_kgCO2e_kg:    # MM virgen, IIR 2016, tabla 4.2
    acero: 1.8
    aluminio: 12.6
    cobre: 3.0
    plasticos: 2.8
    acero_inoxidable: 3.3   # worldstainless (antes ISSF), media mundial con 50 % de chatarra, alcances 1-3 (0,39 + 0,49 + 2,45), según Stainless Steel World (28/06/2022); informe primario no accesible
  acero_inoxidable_rango: [1.95, 6.8]   # 85 % de chatarra / 30 % con NPI (worldstainless)
  reciclado_fin_de_vida_kgCO2e_kg: {metal: 0.07, plastico: 0.01}   # RFD, IIR 2016, tabla 4.5

# Masas por material de lo que cambia entre fluidos o determina el LCCP (decisión 13 del
# 05/10/2026). Compresores y motor como acero (sin desglose de bobinado); batería calculada
# con su geometría declarada (tubo 32 m de 13,3/12,3 mm, 6,43e-4 m³; aletas 37,99 m² de
# 0,1 mm, 1,90e-3 m³; densidades 7900 inox, 8940 cobre, 2700 aluminio); placas por ficha.
# Carcasa, colectores, bastidor y líneas no se incluyen: no hay dato y son comunes.
masas_kg:
  Ammonia:
    acero: 46.0             # Bock F2 18 kg (ficha) + motor 28 kg (adoptado: TEC T3A-100LB4 IE3 3 kW, 28,3 kg)
    acero_inoxidable: 11.17 # tubo de la batería 5,08 + placas 27-30H 5,29 (ficha) + 16-10H 0,80 (0,3 + 0,05·10)
    aluminio: 5.13
  Propane:
    acero: 75.0             # Bock HG22e/160-4 S HC, ficha (motor incluido)
    acero_inoxidable: 6.09  # placas
    cobre: 5.75             # tubo de la batería (decisión 9c)
    aluminio: 5.13
  R32:
    acero: 30.4             # Copeland ZE49KME-TFM, ficha (motor incluido)
    acero_inoxidable: 6.09
    cobre: 5.75
    aluminio: 5.13
motor_F2_rango_kg: [24.6, 31.0]   # motores IE3 de 3 kW y 4 polos, carcasa 100L
