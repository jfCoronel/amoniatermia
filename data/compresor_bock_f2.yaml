# Compresor abierto alternativo Bock F2 NH3 (Danfoss)
# Fuente: capítulo 9, §9.5.3. Parámetros identificados sobre 46 puntos de catálogo.
# Unidades: SI estricto (m, kg, s, K, Pa, W). Ver §9.12.4, "Disciplina de unidades".

id: bock_f2_nh3
tipo: alternativo_abierto
fluido: Ammonia

# --- MODELO DEL COMPRESOR (decisión del autor, 15/10/2026; docs/DECISIONES_2026_10_15.md) ---
# Polinomios de UNE-EN 12900 ajustados a los puntos de BOCK VAP 11.15.5 en toda la envolvente
# (rejilla de 5 K en las zonas sin límites y de refrigeración suplementaria) a cuatro
# velocidades, con 5 K de recalentamiento. Los coeficientes se ajustan al cargar
# (`data.compressor_en12900`), de modo que son trazables al CSV. Reglas: con otro
# recalentamiento se conservan los rendimientos volumétrico, isentrópico y de descarga; el
# subenfriamiento no afecta; en la velocidad, polinomio de segundo grado por mínimos cuadrados
# sobre los nudos. El semiempírico de abajo se conserva para reproducir cifras anteriores
# (`campaign.build_circuit(modelo_compresor="semiempirico")`).
modelo_compresor: en12900
modelo_en12900:
  fuente: vap
  fichero_puntos: compresor_bock_f2_vap_velocidades.csv
  bloques: [E, F]
  recalentamiento_ref_K: 5.0
  # Cilindrada del compresor de los datos: el rendimiento volumétrico se deduce con ella.
  # Escalar `geometria.volumen_barrido_m3_rev` (igualación de capacidad, tabla 6.6) escala
  # caudal y potencia con los mismos rendimientos.
  volumen_barrido_datos_m3_rev: 1.2088e-4
  grado_velocidad: 2
  descarga: polinomio
  # Factores de la incertidumbre del compresor (P3, C10-8): banda del error de ajuste.
  # Nominal: 1, 1 y 0.
  ajuste:
    factor_caudal: 1.0
    factor_potencia: 1.0
    desplazamiento_descarga_K: 0.0

geometria:
  n_cilindros: 2
  diametro_cilindro_m: 0.045      # alesaje 45 mm
  carrera_m: 0.038                # carrera 38 mm
  volumen_barrido_m3_rev: 1.2088e-4
  # Vd = n * (pi/4) * D^2 * S

operacion:
  velocidad_nominal_rpm: 1450
  velocidad_min_rpm: 960          # 66 % de la nominal — margen para H6 (§9.5.3)
  velocidad_max_rpm: 1450
  p_max_baja_Pa: 1.9e+6            # 19 bar, MANOMÉTRICA (ver `limites`)
  p_max_alta_Pa: 2.5e+6            # 25 bar, MANOMÉTRICA (ver `limites`)

# --- Envolvente operativa (§7.6.4; H2 y H3). La comprueba `envelope.evaluate`. ---
limites:
  # El catálogo publica «Max. permissible overpressure (g) (LP/HP) 19 / 25 bar»:
  # SOBREPRESIÓN, esto es, manométrica. El límite absoluto es p_max + p_atm
  # (25 bar(g) = 26.01 bar abs.). Anotado el 28/09/2026: hasta entonces los
  # 25 bar de H3 se leían como absolutos.
  presiones_manometricas: true
  # Temperatura de descarga admisible: el catálogo de Bock NO la publica (solo
  # la temperatura de descarga calculada de cada punto). DECISIÓN DEL AUTOR,
  # 29/09/2026: se adopta el límite ORIENTATIVO del §7.7.1, 140 °C, para
  # compresores alternativos de NH3 con aceite mineral o alquilbenceno, por
  # encima del cual se acelera la degradación del lubricante. Es un valor
  # adoptado, no un dato del fabricante.
  T_descarga_max_K: 413.15
  T_descarga_max_procedencia: "adoptado, §7.7.1 (orientativo)"
  # Diagrama de límites de aplicación del fabricante (VAP 11.15.2, 05/02/2026,
  # `Compresor_F2_NH3_R717.pdf`, pág. 2). Ejes: T0 y T_k de ROCÍO (para NH3
  # puro, la de saturación). Digitalizado el 29/09/2026 desde la imagen del PDF
  # (7 px/K en T0, 3 px/K en T_k; lectura ±0.5 K) y contrastado con la zona de
  # los 39 puntos VAP. Tres zonas: `sin_limites`, `refrigeracion_suplementaria`
  # («e. g. water-cooled cylinder cover») y fuera. El fabricante: «Compressor
  # application limits should not be chosen for design purposes or continuous
  # operation».
  # DECISIÓN DEL AUTOR, 29/09/2026: solo `sin_limites` es admisible. La máquina
  # no lleva tapa de cilindro refrigerada. El límite de 140 °C se mantiene
  # además: el diagrama no depende del recalentamiento y la descarga sí.
  diagrama_aplicacion:
    procedencia: "fabricante, digitalizado (±0.5 K)"
    # Polígonos [T0_C, Tk_C], en sentido antihorario.
    sin_limites_C:
      - [-26.6, 10.0]
      - [-2.0, 10.0]
      - [15.0, 25.0]
      - [15.0, 55.0]
      - [6.9, 55.0]
      - [0.0, 46.5]
      - [-5.0, 40.2]
      - [-10.0, 33.8]
      - [-15.0, 27.2]
      - [-20.0, 20.3]
    envolvente_C:            # sin límites + refrigeración suplementaria
      - [-33.0, 10.0]
      - [-2.0, 10.0]
      - [15.0, 25.0]
      - [15.0, 55.0]
      - [4.5, 55.0]
      - [0.0, 50.3]
      - [-5.0, 44.7]
      - [-10.0, 39.0]
      - [-15.0, 33.0]
      - [-20.0, 26.7]
      - [-25.0, 20.5]
      - [-30.0, 13.7]

# --- Parámetros del capítulo (§9.5.3, antigua tabla 10.4) ---
# YA NO SON EL JUEGO POR DEFECTO desde el 16/09/2026: se conservan como
# referencia del capítulo y para poder reproducir sus resultados, accesibles con
# data.compressor_params(variant="original"). El juego de trabajo es la
# reidentificación de más abajo. Motivo: sobre los 46 puntos estos valores dan
# ±4.5 % en caudal, ±9.8 % en potencia al eje y ±16.8 K en temperatura de
# descarga —con un sesgo sistemático de +14 K—, frente al ±2.7 % / ±6.6 % /
# ±10.5 K que el propio §9.5.3 declara.
# Nueve parámetros: los siete del modelo semiempírico de Winandy et al. (2002)
# más r_v y eta_ic, declarados como extensión motivada por los datos disponibles.
parametros_identificados:
  AU_su_n_W_K: 110.7              # transmisión en aspiración, valor nominal
  AU_ex_n_W_K: 1.00               # LÍMITE INFERIOR del rango explorado
  AU_amb_W_K: 1.07                # LÍMITE INFERIOR del rango explorado
  A_leak_m2: 1.73e-7              # área efectiva de fuga interna
  alpha: 0.0                      # ~0, despreciable
  W_loss_0_W: 12.2                # pérdida mecánica constante
  r_v: 2.0                        # LÍMITE INFERIOR del rango explorado
  eta_ic: 0.613                   # rendimiento isoentrópico interno
  C: 0.0386                       # relación de volumen muerto
  n_politropico: 1.30             # exponente de re-expansión

# --- Rendimientos electromecánicos (ec. 9-9) ---
# NO son parámetros identificados ni figuran en el capítulo: son datos del motor
# externo y de la transmisión. Entran en el denominador de COP y EER por
# exigencia de UNE-EN 14511, luego en el contraste de H1, y su separación es lo
# que da contenido cuantitativo a H6 (§9.5.2, §9.11.2).
#
# VALORES ADOPTADOS el 16/09/2026 por decisión del autor. NO proceden de una
# ficha de fabricante: son una hipótesis de trabajo declarada, no un dato.
# Deben entrar en el análisis de sensibilidad del §6.11 y declararse como tales
# al reportar EER y COP en el capítulo 11.
#
# REESTIMADO el 01/10/2026 (decisión del autor): eta_motor pasa de 0.97 a 0.90,
# un valor usual para un motor asíncrono de 2.2-3 kW clase IE4 (el eje pide
# unos 2.4 kW); el 0.97 era propio de máquinas de más de 100 kW. Con la
# transmisión por correa en 0.98, el producto es 0.882 (antes 0.951): un 11.8 %
# de pérdida electromecánica. Rango de incertidumbre del producto, 0.82-0.89
# (motor IE3 a IE4 de 2.2-3 kW según IEC 60034-30-1, por transmisión de 0.95 a
# 0.98; `uncertainty.FACTORES`).
transmision:
  eta_motor: 0.90
  eta_transmision: 0.98
  procedencia: adoptado_sin_fuente     # no es un dato de fabricante
  sensibilidad_6_11: true

# --- Contraste sobre los 46 puntos de catálogo (16/09/2026) ---
# Evaluando los parámetros de la antigua tabla 10.4 sobre data/compresor_bock_f2_catalogo.csv
# con la implementación de components/compressor.py:
contraste_juego_original:
  caudal_max_desviacion: 0.045        # el §9.5.3 declara ±2.7 %
  potencia_eje_max_desviacion: 0.098  # el §9.5.3 declara ±6.6 %
  T_descarga_max_K: 16.8              # el §9.5.3 declara ±10.5 K
  T_descarga_sesgo_K: 14.2            # sesgo SISTEMÁTICO, no dispersión
  # DISCREPANCIA ABIERTA: los tres exceden lo declarado. Ver
  # docs/historico/PLAN_PUESTA_EN_MARCHA.md §6. No se corrige aquí: el capítulo manda.

# --- JUEGO DE TRABAJO: reidentificación propia sobre los 46 puntos ---
# Adoptado el 16/09/2026 por decisión del autor, en sustitución de la antigua tabla 10.4
# como juego por defecto del modelo. Misma estructura de nueve parámetros, mismos
# 46 puntos y misma función objetivo (w₃ = 16 en T_dis en la ec. 9-10, 4 sobre el residuo).
#
# Procedimiento: multiarranque de cinco puntos de partida; cuatro convergen a
# esta región (coste 0.022-0.026) y uno cae en un mínimo peor. Los valores de
# los parámetros difieren apreciablemente entre las cuatro soluciones buenas,
# pero sus PREDICCIONES no: la temperatura de descarga en el equilibrio de M-2
# queda entre 125.2 y 125.7 °C en las cuatro. Ver la nota de identificabilidad.
reidentificacion_2026_09_16:
  AU_su_n_W_K: 0.00557    # débilmente sujeto; ~0, coherente con el §9.5.2
  AU_ex_n_W_K: 1.0        # en el límite inferior explorado
  AU_amb_W_K: 1.509
  A_leak_m2: 0.0          # NO IDENTIFICABLE con datos de catálogo (ver abajo)
  C: 0.08821
  alpha: 0.0              # NO IDENTIFICABLE con datos de catálogo
  W_loss_0_W: 347.8
  r_v: 1.9653
  eta_ic: 0.8075
  contraste:              # sobre los 46 puntos, 46/46 resueltos
    caudal_max_desviacion: 0.0272      # la revision previa declaraba ±2.7 %; tabla 9.9
    caudal_rmse: 0.0162
    potencia_eje_max_desviacion: 0.0518 # la revision previa declaraba ±6.6 %; tabla 9.9
    potencia_eje_rmse: 0.0179
    T_descarga_max_K: 3.66             # la revision previa declaraba ±10.5 K; tabla 9.9
    T_descarga_rmse_K: 1.74
    T_descarga_sesgo_por_Tc_K: [-1.5, 1.8, 0.2, -1.8, -1.3]   # dispersión, no sesgo
  T_descarga_equilibrio_M2_C: 125.5    # con T_cond impuesta a 46.8 °C (§9.7.8); la revision previa usaba 140.4
  cota_r_v_relajada: true
  # La cota inferior de r_v se bajó de 2.0 a 1.2 porque r_v es aquí un parámetro
  # EFECTIVO y no una cota geométrica (§9.5.1), de modo que el 2.0 del capítulo
  # no tiene justificación física. Relajada, el óptimo queda en 1.965: la cota
  # apenas mordía, contra lo que sugiere la anotación «límite inferior» de la
  # antigua tabla 10.4.

# --- JUEGO DE TRABAJO desde el 24/09/2026: reidentificación con el compresor corregido ---
# DECISIÓN DEL AUTOR, 24/09/2026. El juego del 16/09/2026 se identificó con un
# compresor cuyo sistema interno caía a veces en una meseta creada por
# max(T1, T_su) y devolvía un caudal con un ruido relativo de 1.3e-4. Corregido el
# compresor, se repite el protocolo con los mismos 46 puntos, las mismas cotas
# (`SemiEmpiricalCompressor.BOUNDS`) y la misma función objetivo (w₃ = 16 en T_dis en
# la ec. 9-10, 4 sobre el residuo). Se adopta la solución a la que se llega DESDE EL JUEGO ANTERIOR (S1):
# es su continuación natural y la que menos cambia.
#
# Multiarranque de cinco puntos, esta vez REGISTRADOS (el del 16/09 no los anotó):
#   S1 juego del 16/09/2026        coste 0.02078  <- adoptado
#   S2 antigua tabla 10.4          coste 0.05776  (mínimo peor)
#   S3 [5, 5, 5, 1e-7, 0.05, 0.1, 200, 2.5, 0.7]     coste 0.02078
#   S4 [50, 20, 2, 0, 0.03, 0.2, 100, 3.5, 0.9]      coste 0.02075
#   S5 [1, 2, 10, 5e-7, 0.10, 0.05, 400, 1.5, 0.6]   coste 0.02573  (mínimo peor)
# (orden: AU_su_n, AU_ex_n, AU_amb, A_leak, C, alpha, W_loss_0, r_v, eta_ic)
# Tres de cinco llegan al mismo mínimo con parámetros apreciablemente distintos
# (eta_ic 0.90-0.97, W_loss_0 461-541 W) y predicciones iguales: T_dis a
# T0 = 2 / Tk = 46.8 entre 125.35 y 125.49 °C. El mínimo es plano.
reidentificacion_2026_09_24:
  AU_su_n_W_K: 0.0010002  # en su cota inferior (1e-3): no identificable
  AU_ex_n_W_K: 1.13865
  AU_amb_W_K: 1.00006     # en su cota inferior (1.0)
  A_leak_m2: 0.0          # NO IDENTIFICABLE; converge a 1e-26, fijado a cero
  C: 0.088060             # igual en las tres soluciones buenas (0.0880-0.0882)
  alpha: 0.0              # NO IDENTIFICABLE; converge a 5e-14, fijado a cero
  W_loss_0_W: 461.14
  r_v: 1.99134
  eta_ic: 0.89803
  contraste:              # sobre los 46 puntos, 46/46 resueltos
    caudal_max_desviacion: 0.0271
    caudal_rmse: 0.0162
    potencia_eje_max_desviacion: 0.0472
    potencia_eje_rmse: 0.0173
    T_descarga_max_K: 3.35
    T_descarga_rmse_K: 1.65
    T_descarga_sesgo_medio_K: -0.11
    # error medio de T_dis por T_k (15 ... 50 °C): dispersión, no sesgo
    T_descarga_sesgo_por_Tc_K: [-1.41, 1.25, 1.80, 1.38, 0.16, -1.15, -1.94, -1.39]
  T_descarga_equilibrio_M2_C: 125.46   # con T_cond impuesta a 46.8 °C (§9.7.8)
  T_pared_ficticia_C: 297.9            # a 2 / 46.8 °C: no es una temperatura física
  identificabilidad:
    # Sensibilidad de los residuos a una perturbación RELATIVA de cada parámetro,
    # normalizada, sobre el jacobiano del óptimo. El número de condición es el del
    # jacobiano escalado SIN las dos columnas fijadas a cero (A_leak, alpha); no es
    # comparable con el 6.7e11 del juego anterior, que las incluía.
    # Calculado por notebooks/03_cifras_capitulo_9.py en el óptimo que se alcanza
    # desde los valores redondeados de este bloque (el mínimo es plano y las
    # cifras se mueven algo con el punto exacto).
    numero_de_condicion_7_columnas: 3.2e+4
    bien_sujetos:   {eta_ic: 1.00, r_v: 0.51, W_loss_0: 0.42, C: 0.25}
    debilmente:     {AU_amb: 0.086, AU_ex_n: 0.067, AU_su_n: 1.4e-4}
    no_identificables: {alpha: 7.7e-13, A_leak: 9.1e-22}

# Juegos EQUIVALENTES del multiarranque del 24/09/2026, recalculados el
# 29/09/2026 con los mismos cinco arranques sobre los 46 puntos: S1 (el
# adoptado, coste 0.020780), S3 (0.020780) y S4 (0.020754) llegan al mismo
# mínimo plano con parámetros distintos. S5 (0.025734, +24 %) y S2 (0.057763)
# no son equivalentes. Son el factor discreto del compresor en la
# incertidumbre (C10-8, `uncertainty.juegos_compresor`). Orden de
# `compressor.IDENTIFIED`.
juegos_equivalentes_2026_09_24:
  criterio: "coste a menos de un 1 % del adoptado"
  juegos:
    S3: [0.0010436714, 1.1736956914, 1.0002317691, 0.0, 0.0879864609, 0.0, 464.2141854593, 1.9922261026, 0.9012824060]
    S4: [0.0010000011, 1.5403123080, 1.0001061646, 0.0, 0.0880156896, 0.0, 541.2664887505, 2.0069315228, 0.9721319235]

# --- Identificabilidad práctica (jacobiano escalado en el óptimo) ---
# Sensibilidad de los residuos a una perturbación RELATIVA de cada parámetro,
# normalizada. Es el resultado más útil de todo el ajuste para la reescritura
# del capítulo: de los nueve parámetros, los datos de catálogo solo sujetan
# cinco, y dos no los sujetan en absoluto.
identificabilidad:
  numero_de_condicion: 6.7e+11
  bien_sujetos:   {AU_ex_n: 1.00, W_loss_0: 0.94, r_v: 0.91, AU_amb: 0.77, eta_ic: 0.64}
  debilmente:     {C: 0.082, AU_su_n: 0.0052}
  no_identificables: {alpha: 2.8e-7, A_leak: 2.9e-14}
  # Consecuencia: A_leak y alpha convergen a cero y fijarlos a cero exacto no
  # altera el ajuste en ninguna cifra significativa. La antigua tabla 10.4 publica
  # A_leak = 1.73e-7 m2 como si estuviese identificado; los datos no lo
  # determinan. Y los valores individuales no deben interpretarse físicamente:
  # soluciones con parámetros muy distintos predicen casi lo mismo.

# AVISOS para quien implemente:
#  - AU_ex_n, AU_amb y r_v han quedado en el límite inferior del rango explorado.
#    §9.5.3 lo declara como identificación mal condicionada en esos tres parámetros:
#    el catálogo no publica r_v y la identificación no puede separarlo del desajuste
#    de volumen. NO tratar estos tres valores como propiedades físicas medidas.
#  - El catálogo solo da prestaciones a 1450 rpm. Extrapolar a otras velocidades
#    (necesario para H6) NO está soportado por dato alguno.

# Los 46 puntos están en data/compresor_bock_f2_catalogo.csv, transcripción en
# texto plano de COMPRESOR_BOCK_F2_NH3.xlsx. Convenio de ensayo de la hoja LEAME:
# recalentamiento de aspiración 1 K, subenfriamiento nulo, 1450 rpm. La potencia
# publicada es AL EJE (compresor abierto), no eléctrica.
dominio_identificacion:
  T_evap_C: [0, 5]
  T_cond_C: [15, 50]
  recalentamiento_aspiracion_K: 1
  subenfriamiento_K: 0
  n_puntos: 46

punto_referencia_fabricante:
  T_evap_C: 0
  T_cond_C: 45
  salto_entalpico_kJ_kg: 270.9

# --- Corrección entre fluidos (§9.5.3, §9.6.3) ---
# AU_su_n y AU_ex_n se corrigen por analogía de Dittus-Boelter al cambiar de fluido.
# r_v y eta_ic NO admiten corrección análoga: no representan un mecanismo de
# transporte con grupo adimensional conocido.
correccion_entre_fluidos:
  aplicable_a: [AU_su_n, AU_ex_n]
  no_aplicable_a: [r_v, eta_ic]
